name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A803E1: ${{ secrets.A803E1 }}
          B38DE3: ${{ secrets.B38DE3 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A803E1', '')
          bm = os.environ.get('B38DE3', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 7522062da022a9c0b649cc182fdfa7996e97e4204f6662 -->', gm)
          if bm:
              s2 = s2.replace('<!-- 041523c1ebcad5f49bcda299f5 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
